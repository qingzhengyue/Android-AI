<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星梭 Scratch 积木查看器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f8fafc;
  color: #1e293b;
  display: flex;
  flex-direction: column;
}

.top-nav {
  height: 40px;
  background: #1e293b;
  color: #f8fafc;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
}
.top-title {
  font-size: 13px;
  font-weight: 700;
  color: #38bdf8;
}
.main-layout {
  display: flex;
  flex: 1;
  width: 100%;
  min-height: 0;
  overflow: hidden;
  background: #f8fafc;
}
.workspace-pane {
  flex: 1;
  background: #f8fafc;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
}
.badge {
  background: #e0f2fe;
  color: #0284c7;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
}
.canvas-container {
  background: #ffffff;
  border: 2px dashed #cbd5e1;
  border-radius: 10px;
  flex: 1;
  min-height: 200px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}
.scratch-block {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  color: #fff;
  font-size: 11.5px;
  font-weight: 600;
  min-height: 32px;
  gap: 5px;
}
.cat-motion { background: #4C97FF; }
.cat-looks { background: #9966FF; }
.cat-sound { background: #CF63CF; }
.cat-events { background: #FFBF00; color: #452800 !important; }
.cat-control { background: #FFAB19; }
.cat-sensing { background: #5CB1D6; }
.cat-operators { background: #59C059; }
.cat-data { background: #FF8C1A; }
</style>
</head>
<body>
<div class="top-nav">
  <div class="top-title"><span>🧩 Scratch 积木查看器</span></div>
  <span class="badge" id="blockCountText">0 个积木</span>
</div>
<div class="main-layout">
  <div class="workspace-pane">
    <div class="canvas-container" id="canvasStack">
      <div style="text-align:center;color:#94a3b8;padding:20px;">正在加载作品积木...</div>
    </div>
  </div>
</div>
<script>
const OP_TRANSLATE_MAP = {
  'motion_movesteps': '移动 10 步',
  'motion_turnright': '右转 15 度',
  'motion_turnleft': '左转 15 度',
  'motion_goto': '移到 随机位置',
  'motion_gotoxy': '移到 x:0 y:0',
  'motion_glideto': '在 1 秒内滑行到 随机位置',
  'motion_glidesecstoxy': '在 1 秒内滑行到 x:0 y:0',
  'motion_changexby': '将 x 坐标增加 10',
  'motion_changeyby': '将 y 坐标增加 10',
  'motion_ifonedgebounce': '碰到边缘就反弹',
  'looks_sayforsecs': '说 Hello! 2 秒',
  'looks_say': '说 Hello!',
  'looks_nextcostume': '下一个造型',
  'looks_show': '显示',
  'looks_hide': '隐藏',
  'sound_play': '播放声音 喵',
  'event_whenflagclicked': '当 🟢 被点击',
  'event_whenkeypressed': '当按下 空格 键',
  'control_wait': '等待 1 秒',
  'control_repeat': '重复执行 10 次',
  'control_forever': '重复执行 [循环]',
  'control_if': '如果 <条件> 那么',
  'data_setvariableto': '将 变量 设为 0',
  'data_changevariableby': '将 变量 增加 1'
};

function getCategoryClassByOpcode(op) {
  if (!op) return 'cat-motion';
  if (op.startsWith('motion')) return 'cat-motion';
  if (op.startsWith('looks')) return 'cat-looks';
  if (op.startsWith('sound')) return 'cat-sound';
  if (op.startsWith('event')) return 'cat-events';
  if (op.startsWith('control')) return 'cat-control';
  if (op.startsWith('sensing')) return 'cat-sensing';
  if (op.startsWith('operator')) return 'cat-operators';
  return 'cat-data';
}

window.loadProject = function(jsonInput) {
  try {
    if (!jsonInput) return;
    let obj = jsonInput;
    if (typeof jsonInput === 'string') {
      const trimmed = jsonInput.trim();
      if (!trimmed || trimmed === "{}") return;
      try { obj = JSON.parse(trimmed); } catch(e) { return; }
    }
    const blocks = [];
    if (obj && obj.targets && Array.isArray(obj.targets)) {
      obj.targets.forEach(t => {
        if (t && t.blocks) {
          if (Array.isArray(t.blocks)) {
            t.blocks.forEach(b => {
              const op = (typeof b === 'string') ? b : (b.opcode || '');
              if (op) blocks.push({ opcode: op, label: OP_TRANSLATE_MAP[op] || op });
            });
          } else if (typeof t.blocks === 'object') {
            for (let id in t.blocks) {
              const b = t.blocks[id];
              if (b && typeof b === 'object' && b.opcode) {
                const op = b.opcode;
                blocks.push({ opcode: op, label: OP_TRANSLATE_MAP[op] || op });
              }
            }
          }
        }
      });
    }
    const stackEl = document.getElementById('canvasStack');
    const countEl = document.getElementById('blockCountText');
    if (countEl) countEl.innerText = blocks.length + ' 个积木';
    if (!stackEl) return;
    if (blocks.length === 0) {
      stackEl.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">作品暂无积木代码</div>';
      return;
    }
    let html = '';
    blocks.forEach(b => {
      const cls = getCategoryClassByOpcode(b.opcode);
      html += `<div class="scratch-block ${cls}"><span>${b.label}</span></div>`;
    });
    stackEl.innerHTML = html;
  } catch(e) {}
};

window.onload = function() {
  if (window.AndroidProjectProvider && window.AndroidProjectProvider.fetchProjectJson) {
    const json = window.AndroidProjectProvider.fetchProjectJson();
    if (json && json !== "{}" && json.length > 2) {
      window.loadProject(json);
    }
  }
};
</script>
</body>
</html>
